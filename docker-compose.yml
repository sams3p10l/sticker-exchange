services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: razmena
      POSTGRES_USER: razmena
      POSTGRES_PASSWORD: razmena
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razmena -d razmena"]
      interval: 2s
      timeout: 5s
      retries: 20
